<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Kalahari Springs</title>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
		<style>

/* ── Godot canvas & body reset ── */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ── Godot status overlay (kept for error notices) ── */
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ── Start screen ── */
#start-screen {
	position: fixed;
	inset: 0;
	z-index: 100;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: linear-gradient(180deg, #0d1f2d 0%, #1a3a2e 55%, #2d5a3a 100%);
	transition: opacity 0.6s ease;
}

/* Stars */
#ks-stars {
	position: absolute;
	inset: 0;
	pointer-events: none;
}

.ks-star {
	position: absolute;
	background: #fff;
	border-radius: 50%;
	animation: ks-twinkle var(--dur) ease-in-out infinite alternate;
}

@keyframes ks-twinkle {
	from { opacity: 0.2; }
	to   { opacity: 0.9; }
}

/* Moon */
#ks-moon {
	position: absolute;
	top: 40px;
	right: 80px;
	width: 52px;
	height: 52px;
	border-radius: 50%;
	background: #f5e6c0;
	box-shadow: 0 0 28px 10px rgba(245,230,192,0.2);
	pointer-events: none;
}

/* Hills silhouette */
#ks-hills {
	position: absolute;
	bottom: 0;
	left: 0;
	right: 0;
	pointer-events: none;
}

/* Acacia trees */
.ks-acacia {
	position: absolute;
	bottom: 0;
	pointer-events: none;
}

/* Content */
#ks-content {
	position: relative;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
	gap: 0;
	padding: 2rem;
}

#ks-tagline {
	font-family: 'Nunito', sans-serif;
	font-size: 11px;
	font-weight: 600;
	letter-spacing: 0.22em;
	color: #9fceb0;
	text-transform: uppercase;
	margin-bottom: 10px;
}

#ks-title {
	font-family: 'Yeseva One', serif;
	font-size: 64px;
	line-height: 1;
	color: #f5e6c0;
	margin: 0 0 4px;
	text-shadow: 0 2px 28px rgba(0,0,0,0.6);
}

#ks-subtitle {
	font-family: 'Yeseva One', serif;
	font-size: 30px;
	color: #9fceb0;
	margin: 0 0 28px;
}

#ks-hippo {
	margin-bottom: 24px;
	animation: ks-float 3.2s ease-in-out infinite;
}

@keyframes ks-float {
	0%, 100% { transform: translateY(0);   }
	50%       { transform: translateY(-9px); }
}

/* Progress bar */
#ks-progress-wrap {
	width: 260px;
	height: 4px;
	background: rgba(255,255,255,0.12);
	border-radius: 4px;
	overflow: hidden;
	margin-bottom: 8px;
}

#progress-bar {
	height: 100%;
	width: 0%;
	background: #9fceb0;
	border-radius: 4px;
	transition: width 0.25s ease;
}

#ks-progress-label {
	font-family: 'Nunito', sans-serif;
	font-size: 11px;
	color: rgba(159,206,176,0.7);
	letter-spacing: 0.06em;
	margin-bottom: 20px;
	min-height: 16px;
}

/* Start button */
#start-btn {
	font-family: 'Nunito', sans-serif;
	font-size: 16px;
	font-weight: 600;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: #1a3a2e;
	background: #f5e6c0;
	border: none;
	border-radius: 40px;
	padding: 14px 52px;
	cursor: pointer;
	box-shadow: 0 4px 24px rgba(0,0,0,0.4);
	transition: transform 0.15s, background 0.15s, box-shadow 0.15s, opacity 0.3s;
	opacity: 0;
	pointer-events: none;
}

#start-btn.ready {
	opacity: 1;
	pointer-events: auto;
	animation: ks-fadein 0.5s ease both;
}

@keyframes ks-fadein {
	from { opacity: 0; transform: translateY(8px); }
	to   { opacity: 1; transform: translateY(0);   }
}

#start-btn:hover {
	background: #fff8e8;
	transform: scale(1.04);
	box-shadow: 0 6px 32px rgba(0,0,0,0.5);
}

#start-btn:active {
	transform: scale(0.98);
}

		</style>
	</head>
	<body>

		<!-- ═══════════════════════════════════════════
		     START SCREEN
		     ═══════════════════════════════════════════ -->
		<div id="start-screen">

			<div id="ks-stars"></div>
			<div id="ks-moon"></div>

			<!-- Hills -->
			<svg id="ks-hills" viewBox="0 0 800 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M0,130 Q100,70 200,110 Q300,150 400,90 Q500,30 600,100 Q700,150 800,110 L800,180 L0,180Z" fill="#1e5c3a" opacity="0.7"/>
				<path d="M0,150 Q120,100 250,140 Q380,160 500,120 Q620,80 800,140 L800,180 L0,180Z" fill="#163d28"/>
				<path d="M0,168 Q200,145 400,162 Q600,175 800,158 L800,180 L0,180Z" fill="#0f2c1d"/>
			</svg>

			<!-- Acacia left -->
			<svg class="ks-acacia" style="left:48px;width:88px;height:100px;" viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
				<rect x="37" y="40" width="6" height="48" fill="#3a2a1a"/>
				<rect x="36" y="28" width="3" height="18" fill="#3a2a1a" transform="rotate(-30 37 50)"/>
				<rect x="41" y="28" width="3" height="18" fill="#3a2a1a" transform="rotate(25 43 50)"/>
				<ellipse cx="40" cy="22" rx="32" ry="14" fill="#1a4a28"/>
				<ellipse cx="16" cy="30" rx="18" ry="9"  fill="#1a4a28"/>
				<ellipse cx="62" cy="32" rx="20" ry="9"  fill="#1a4a28"/>
				<ellipse cx="40" cy="18" rx="28" ry="11" fill="#236635"/>
			</svg>

			<!-- Acacia right -->
			<svg class="ks-acacia" style="right:64px;width:66px;height:78px;" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
				<rect x="27" y="30" width="5" height="38" fill="#3a2a1a"/>
				<rect x="26" y="20" width="3" height="14" fill="#3a2a1a" transform="rotate(-28 27 38)"/>
				<rect x="31" y="20" width="3" height="14" fill="#3a2a1a" transform="rotate(22 32 38)"/>
				<ellipse cx="30" cy="16" rx="24" ry="11" fill="#1a4a28"/>
				<ellipse cx="10" cy="23" rx="14" ry="7"  fill="#1a4a28"/>
				<ellipse cx="48" cy="24" rx="15" ry="7"  fill="#1a4a28"/>
				<ellipse cx="30" cy="13" rx="20" ry="9"  fill="#236635"/>
			</svg>

			<div id="ks-content">
				<div id="ks-tagline">A water-life story</div>
				<div id="ks-title">Kalahari</div>
				<div id="ks-subtitle">Springs</div>

				<!-- Hope the Hippo -->
				<div id="ks-hippo">
					<img src="hope-splash.svg" alt="Hope the hippo" width="200" height="200">
				</div>

				<div id="ks-progress-wrap">
					<div id="progress-bar"></div>
				</div>
				<div id="ks-progress-label">Loading the village...</div>

				<button id="start-btn">Begin Your Journey</button>
			</div>

		</div>
		<!-- end #start-screen -->


		<!-- ═══════════════════════════════════════════
		     GODOT CANVAS (hidden until game starts)
		     ═══════════════════════════════════════════ -->
		<canvas id="canvas" style="display:none;">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<!-- Godot status overlay — kept solely for error notices -->
		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>


		<!-- ═══════════════════════════════════════════
		     GODOT ENGINE
		     ═══════════════════════════════════════════ -->
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9636456,"index.wasm":35749181},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay  = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice   = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display   = mode === 'notice'   ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	}

	else {
		// Hide Godot's built-in status overlay — our start screen takes over
		setStatusMode('hidden');

		// Wire the Start button: engine.startGame() is deferred until the
		// user clicks, satisfying the browser's user-gesture requirement for audio.
		document.getElementById('start-btn').addEventListener('click', () => {
			document.getElementById('start-btn').disabled = true;
			document.getElementById('ks-progress-label').textContent = 'Starting…';

			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						const pct = (current / total) * 100;
						document.getElementById('progress-bar').style.width = pct + '%';
						// Keep the native progress element in sync (used by error handling)
						statusProgress.value = current;
						statusProgress.max   = total;
					}
				},
			}).then(() => {
				// Game is fully loaded — fade out the start screen, reveal canvas
				const screen = document.getElementById('start-screen');
				screen.style.opacity = '0';
				setTimeout(() => {
					screen.remove();
					document.getElementById('canvas').style.display = 'block';
					document.getElementById('canvas').focus();
				}, 600);
			}, displayFailureNotice); // Godot's error handler stays intact
		});

		// Pre-load the engine assets while the start screen is visible so the
		// button click -> game launch feels instant.  onProgress fires here too,
		// giving us a real loading bar before the user even clicks Start.
		engine.init(GODOT_CONFIG['executable']).then(() => {
			const label = document.getElementById('ks-progress-label');
			const btn   = document.getElementById('start-btn');
			label.style.opacity = '0';
			setTimeout(() => {
				label.style.display = 'none';
				document.getElementById('ks-progress-wrap').style.display = 'none';
				btn.classList.add('ready');
			}, 400);
		}).catch(displayFailureNotice);
	}

}());
		</script>


		<!-- ═══════════════════════════════════════════
		     START SCREEN JAVASCRIPT
		     ═══════════════════════════════════════════ -->
		<script>
(function () {
	// Scatter stars
	const starContainer = document.getElementById('ks-stars');
	for (let i = 0; i < 70; i++) {
		const s = document.createElement('div');
		s.className = 'ks-star';
		const size = (Math.random() * 2.2 + 0.5).toFixed(1);
		const dur  = (Math.random() * 2 + 1.4).toFixed(1);
		s.style.cssText = [
			'width:'  + size + 'px',
			'height:' + size + 'px',
			'top:'    + Math.floor(Math.random() * 58) + '%',
			'left:'   + Math.floor(Math.random() * 100) + '%',
			'--dur:'  + dur + 's',
		].join(';');
		starContainer.appendChild(s);
	}
}());
		</script>
		<script>
  window.addEventListener("keydown", function(e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
    }
  });
</script>
